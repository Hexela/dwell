name: Dwell
options:
  bundleIdPrefix: com.hexela.dwell
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  generateEmptyDirectories: true
  groupSortPosition: top
  minimumXcodeGenVersion: 2.44.1
  xcodeVersion: "26.0"

settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: 0.1.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"

packages:
  DwellKit:
    path: Packages/DwellKit

targets:
  DwellApp:
    type: application
    platform: macOS
    sources:
      - path: Apps/DwellApp
    dependencies:
      - package: DwellKit
        product: DwellDomain
      - package: DwellKit
        product: DwellSchemas
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/DwellApp.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Dwell
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        PRODUCT_BUNDLE_IDENTIFIER: com.hexela.dwell
        PRODUCT_NAME: Dwell

  DwellDaemon:
    type: tool
    platform: macOS
    sources:
      - path: Services/DwellDaemon
    dependencies:
      - package: DwellKit
        product: DwellDomain
      - package: DwellKit
        product: DwellSchemas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hexela.dwell.daemon
        PRODUCT_NAME: DwellDaemon

  DwellCLI:
    type: tool
    platform: macOS
    sources:
      - path: Tools/DwellCLI
    dependencies:
      - package: DwellKit
        product: DwellDomain
      - package: DwellKit
        product: DwellSchemas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hexela.dwell.cli
        PRODUCT_NAME: dwellctl

schemes:
  Dwell:
    build:
      targets:
        DwellApp: all
        DwellDaemon: all
        DwellCLI: all
    run:
      config: Debug
      executable: DwellApp
    archive:
      config: Release

  DwellApp:
    build:
      targets:
        DwellApp: all
    run:
      config: Debug
    archive:
      config: Release

  DwellDaemon:
    build:
      targets:
        DwellDaemon: all
    run:
      config: Debug

  DwellCLI:
    build:
      targets:
        DwellCLI: all
    run:
      config: Debug

