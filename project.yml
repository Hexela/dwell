name: Dwell
options:
  bundleIdPrefix: com.hexela.dwell
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  generateEmptyDirectories: true
  groupSortPosition: top
  minimumXcodeGenVersion: 2.44.1
  xcodeVersion: "26.0"

settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: 0.1.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"

packages:
  DwellKit:
    path: Packages/DwellKit

targets:
  DwellApp:
    type: application
    platform: macOS
    sources:
      - path: Apps/DwellApp
    dependencies:
      - package: DwellKit
        product: DwellDomain
      - package: DwellKit
        product: DwellSchemas
      - package: DwellKit
        product: DwellIPC
      - target: DwellDaemon
        embed: false
      - target: DwellZigbeeAdapter
        embed: false
    postBuildScripts:
      - name: Embed LaunchDaemon
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          daemon_directory="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          plist_directory="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          /bin/mkdir -p "${daemon_directory}" "${plist_directory}"
          /usr/bin/ditto "${BUILT_PRODUCTS_DIR}/DwellDaemon" "${daemon_directory}/DwellDaemon"
          /usr/bin/ditto "${BUILT_PRODUCTS_DIR}/DwellZigbeeAdapter" "${daemon_directory}/DwellZigbeeAdapter"
          /usr/bin/ditto "${SRCROOT}/Config/LaunchDaemons/com.hexela.dwell.daemon.v2.plist" "${plist_directory}/com.hexela.dwell.daemon.v2.plist"
          local_broker_configuration="${SRCROOT}/Config/Local/development-broker.json"
          fallback_broker_configuration="${SRCROOT}/Config/development-broker.json"
          broker_configuration=""
          if [ -f "${local_broker_configuration}" ]; then
            broker_configuration="${local_broker_configuration}"
          elif [ -f "${fallback_broker_configuration}" ]; then
            broker_configuration="${fallback_broker_configuration}"
          fi
          if [ -n "${broker_configuration}" ]; then
            /usr/bin/ditto "${broker_configuration}" "${daemon_directory}/development-broker.json"
            echo "Embedded MQTT broker configuration from ${broker_configuration}"
          else
            echo "No development MQTT broker configuration found"
          fi
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/DwellApp.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dwell
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        PRODUCT_BUNDLE_IDENTIFIER: com.hexela.dwell
        PRODUCT_NAME: Dwell

  DwellDaemon:
    type: tool
    platform: macOS
    sources:
      - path: Services/DwellDaemon
    dependencies:
      - package: DwellKit
        product: DwellIPC
      - package: DwellKit
        product: DwellMQTT
      - package: DwellKit
        product: DwellMQTTNIO
      - package: DwellKit
        product: DwellHistory
      - package: DwellKit
        product: DwellPersistence
      - package: DwellKit
        product: DwellRegistry
      - package: DwellKit
        product: DwellSchemas
    settings:
      base:
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENTITLEMENTS_ALLOWED: NO
        ENTITLEMENTS_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: YES
        OTHER_CODE_SIGN_FLAGS: "--timestamp --identifier com.hexela.dwell.daemon.v2"
        PRODUCT_BUNDLE_IDENTIFIER: com.hexela.dwell.daemon.v2
        PRODUCT_NAME: DwellDaemon

  DwellZigbeeAdapter:
    type: tool
    platform: macOS
    sources:
      - path: Services/DwellZigbeeAdapter
    dependencies:
      - package: DwellKit
        product: DwellDomain
      - package: DwellKit
        product: DwellMQTT
      - package: DwellKit
        product: DwellMQTTNIO
      - package: DwellKit
        product: DwellZigbee
    settings:
      base:
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENTITLEMENTS_ALLOWED: NO
        ENTITLEMENTS_REQUIRED: NO
        OTHER_CODE_SIGN_FLAGS: "--timestamp --identifier com.hexela.dwell.adapter.zigbee2mqtt"
        PRODUCT_BUNDLE_IDENTIFIER: com.hexela.dwell.adapter.zigbee2mqtt
        PRODUCT_NAME: DwellZigbeeAdapter

  DwellCLI:
    type: tool
    platform: macOS
    sources:
      - path: Tools/DwellCLI
    dependencies:
      - package: DwellKit
        product: DwellIPC
    settings:
      base:
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENTITLEMENTS_ALLOWED: NO
        ENTITLEMENTS_REQUIRED: NO
        OTHER_CODE_SIGN_FLAGS: "--timestamp --identifier com.hexela.dwell.cli"
        PRODUCT_BUNDLE_IDENTIFIER: com.hexela.dwell.cli
        PRODUCT_NAME: dwellctl

  DwellProtocolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/DwellKit/Tests/DwellSchemasTests
      - path: Packages/DwellKit/Tests/DwellIPCTests
      - path: Packages/DwellKit/Tests/DwellMQTTTests
      - path: Packages/DwellKit/Tests/DwellHistoryTests
      - path: Packages/DwellKit/Tests/DwellPersistenceTests
      - path: Packages/DwellKit/Tests/DwellRegistryTests
      - path: Packages/DwellKit/Tests/DwellZigbeeTests
      - path: Tests/Service
      - path: Services/DwellDaemon/DaemonRuntime.swift
      - path: Services/DwellDaemon/DwellXPCService.swift
      - path: Services/DwellDaemon/DeviceCommandDispatcher.swift
      - path: Services/DwellDaemon/AdapterSupervisor.swift
    dependencies:
      - package: DwellKit
        product: DwellDomain
      - package: DwellKit
        product: DwellSchemas
      - package: DwellKit
        product: DwellIPC
      - package: DwellKit
        product: DwellMQTT
      - package: DwellKit
        product: DwellHistory
      - package: DwellKit
        product: DwellPersistence
      - package: DwellKit
        product: DwellRegistry
      - package: DwellKit
        product: DwellZigbee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hexela.dwell.tests.protocol
        PRODUCT_NAME: DwellProtocolTests

schemes:
  Dwell:
    build:
      targets:
        DwellApp: all
        DwellDaemon: all
        DwellCLI: all
        DwellZigbeeAdapter: all
    run:
      config: Debug
      executable: DwellApp
    test:
      config: Debug
      targets:
        - DwellProtocolTests
    archive:
      config: Release

  DwellApp:
    build:
      targets:
        DwellApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DwellProtocolTests
    archive:
      config: Release

  DwellDaemon:
    build:
      targets:
        DwellDaemon: all
    run:
      config: Debug

  DwellCLI:
    build:
      targets:
        DwellCLI: all
    run:
      config: Debug
