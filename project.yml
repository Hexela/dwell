name: Dwell
options:
  bundleIdPrefix: com.hexela.dwell
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  generateEmptyDirectories: true
  groupSortPosition: top
  minimumXcodeGenVersion: 2.44.1
  xcodeVersion: "26.0"

settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: 0.1.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"

packages:
  DwellKit:
    path: Packages/DwellKit

targets:
  DwellApp:
    type: application
    platform: macOS
    sources:
      - path: Apps/DwellApp
    dependencies:
      - package: DwellKit
        product: DwellDomain
      - package: DwellKit
        product: DwellSchemas
      - package: DwellKit
        product: DwellIPC
      - target: DwellDaemon
    postBuildScripts:
      - name: Embed LaunchDaemon
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          daemon_directory="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchServices"
          plist_directory="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          /bin/mkdir -p "${daemon_directory}" "${plist_directory}"
          /usr/bin/ditto "${BUILT_PRODUCTS_DIR}/DwellDaemon" "${daemon_directory}/DwellDaemon"
          /usr/bin/ditto "${SRCROOT}/Config/LaunchDaemons/com.hexela.dwell.daemon.plist" "${plist_directory}/com.hexela.dwell.daemon.plist"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/DwellApp.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Dwell
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        PRODUCT_BUNDLE_IDENTIFIER: com.hexela.dwell
        PRODUCT_NAME: Dwell

  DwellDaemon:
    type: tool
    platform: macOS
    sources:
      - path: Services/DwellDaemon
    dependencies:
      - package: DwellKit
        product: DwellIPC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hexela.dwell.daemon
        PRODUCT_NAME: DwellDaemon

  DwellCLI:
    type: tool
    platform: macOS
    sources:
      - path: Tools/DwellCLI
    dependencies:
      - package: DwellKit
        product: DwellIPC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hexela.dwell.cli
        PRODUCT_NAME: dwellctl

  DwellProtocolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/DwellKit/Tests/DwellSchemasTests
      - path: Packages/DwellKit/Tests/DwellIPCTests
      - path: Tests/Service
      - path: Services/DwellDaemon/DaemonRuntime.swift
      - path: Services/DwellDaemon/DwellXPCService.swift
    dependencies:
      - package: DwellKit
        product: DwellDomain
      - package: DwellKit
        product: DwellSchemas
      - package: DwellKit
        product: DwellIPC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hexela.dwell.tests.protocol
        PRODUCT_NAME: DwellProtocolTests

schemes:
  Dwell:
    build:
      targets:
        DwellApp: all
        DwellDaemon: all
        DwellCLI: all
    run:
      config: Debug
      executable: DwellApp
    test:
      config: Debug
      targets:
        - DwellProtocolTests
    archive:
      config: Release

  DwellApp:
    build:
      targets:
        DwellApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DwellProtocolTests
    archive:
      config: Release

  DwellDaemon:
    build:
      targets:
        DwellDaemon: all
    run:
      config: Debug

  DwellCLI:
    build:
      targets:
        DwellCLI: all
    run:
      config: Debug
